<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoop Report</title>
<style>
  :root {
    --bg: #FFF8E7; --surface: #FFFEFA; --ink: #4B3621; --ink-muted: #8A6F52;
    --hairline: rgba(75, 54, 33, 0.16); --pill-bg: #FFFEFA;
    --korea: #C85476; --korea-soft: #FADADD; --us: #2F8571; --us-soft: #A3E4D7; --japan: #B87A1F; --japan-soft: #F5DDB0;
    --shadow: 0 14px 30px -20px rgba(75, 54, 33, 0.28);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #3D2C1E; --surface: #4A3726; --ink: #FBF0DE; --ink-muted: #D2B896;
      --hairline: rgba(251, 240, 222, 0.18); --pill-bg: #55402C;
      --korea: #F5A9BE; --korea-soft: #66404B; --us: #8FE0CC; --us-soft: #2E5049; --japan: #F0C888; --japan-soft: #5A4530;
      --shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #3D2C1E; --surface: #4A3726; --ink: #FBF0DE; --ink-muted: #D2B896;
    --hairline: rgba(251, 240, 222, 0.18); --pill-bg: #55402C;
    --korea: #F5A9BE; --korea-soft: #66404B; --us: #8FE0CC; --us-soft: #2E5049; --japan: #F0C888; --japan-soft: #5A4530;
    --shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --bg: #FFF8E7; --surface: #FFFEFA; --ink: #4B3621; --ink-muted: #8A6F52;
    --hairline: rgba(75, 54, 33, 0.16); --pill-bg: #FFFEFA;
    --korea: #C85476; --korea-soft: #FADADD; --us: #B87A1F; --us-soft: #F5DDB0; --japan: #2F8571; --japan-soft: #A3E4D7;
    --shadow: 0 14px 30px -20px rgba(75, 54, 33, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 110px; }
  .archive-back { display: none; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-muted); text-decoration: none; margin-bottom: 16px; }
  .archive-back:hover { color: var(--ink); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-muted); margin: 0 0 10px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
  .headline { font-size: clamp(28px, 7vw, 38px); font-weight: 800; line-height: 1.12; letter-spacing: -0.02em; margin: 0; max-width: 13ch; text-wrap: balance; }
  .head-side { max-width: 30ch; }
  .head-blurb { font-size: 13.5px; color: var(--ink-muted); line-height: 1.55; margin: 0 0 12px; }
  .cta { display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 100px; border: none; cursor: pointer; font-family: inherit; text-decoration: none; }
  .cta:hover { opacity: 0.85; }
  .list-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin: 26px 2px 14px; }
  .hero-list { display: flex; flex-direction: column; gap: 34px; }
  .hero-card { position: relative; }
  .hero-art { height: 190px; border-radius: 26px; position: relative; overflow: hidden; background: var(--surface); }
  .hero-art svg { display: block; width: 100%; height: 100%; }
  .hero-card::before { content: ""; position: absolute; inset: 10px 10px auto 10px; height: 190px; border-radius: 30px; background: var(--card-color); filter: blur(26px); opacity: 0.35; z-index: -1; }
  .hero-panel { background: var(--surface); border-radius: 20px; margin: -46px 14px 0; position: relative; z-index: 2; padding: 18px 20px 20px; box-shadow: var(--shadow); border: 1px solid var(--hairline); }
  .hero-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--card-color); margin-bottom: 10px; }
  .hero-badge-icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--card-soft); }
  .hero-title { font-size: 19px; font-weight: 800; line-height: 1.3; margin: 0 0 8px; text-wrap: balance; }
  .hero-summary { font-size: 13.5px; line-height: 1.6; color: var(--ink-muted); margin: 0 0 14px; max-width: 56ch; }
  .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .hero-tag { font-size: 11px; font-weight: 600; color: var(--card-color); background: var(--card-soft); padding: 4px 10px; border-radius: 100px; }
  .hero-link { font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .hero-link:hover { color: var(--card-color); }
  #landing.hidden { display: none; }
  #detail { display: none; }
  #detail.active { display: block; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-muted); text-decoration: none; margin-bottom: 18px; }
  .back-link:hover { color: var(--ink); }
  .detail-header { background: var(--card-soft); border-radius: 20px; padding: 22px; margin-bottom: 22px; }
  .detail-badge { font-size: 12px; font-weight: 700; color: var(--card-color); text-transform: uppercase; letter-spacing: 0.05em; }
  .detail-title { font-size: 26px; font-weight: 800; margin: 6px 0 10px; text-wrap: balance; }
  .detail-summary { font-size: 14.5px; line-height: 1.65; margin: 0; max-width: 60ch; color: var(--ink); }
  .panel { border: 1px solid var(--hairline); border-radius: 16px; padding: 18px 18px 6px; margin-bottom: 6px; background: var(--surface); }
  .bar-row { display: grid; grid-template-columns: 84px 1fr 32px; align-items: center; gap: 10px; padding: 7px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--hairline); }
  .bar-label { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { position: relative; height: 6px; background: var(--hairline); border-radius: 100px; overflow: hidden; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 100px; background: var(--card-color); }
  .bar-value { font-size: 11.5px; color: var(--ink-muted); text-align: right; font-variant-numeric: tabular-nums; }
  .chart-foot { font-size: 11px; color: var(--ink-muted); margin: 12px 0 16px; }
  .list { border-top: 1px solid var(--hairline); }
  .row { display: grid; grid-template-columns: 1fr 96px; gap: 16px; padding: 16px 2px; border-bottom: 1px solid var(--hairline); text-decoration: none; color: inherit; align-items: center; }
  .row-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; background: var(--card-soft); color: var(--card-color); padding: 3px 9px; border-radius: 100px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .row-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin: 0 0 5px; text-wrap: balance; }
  .row-desc { font-size: 13px; color: var(--ink-muted); line-height: 1.5; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-meta { font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .row-thumb { width: 96px; height: 96px; border-radius: 12px; overflow: hidden; flex: none; display: grid; place-items: center; font-size: 28px; background: var(--card-soft); }
  .sources { border-top: 1px solid var(--hairline); }
  .source-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 2px; font-size: 12.5px; border-bottom: 1px solid var(--hairline); }
  .source-row a { color: var(--ink); text-decoration: none; }
  .source-row a:hover { color: var(--ink-muted); }
  .source-num { color: var(--ink-muted); font-variant-numeric: tabular-nums; flex: none; }
  .past-reports { border-top: 1px solid var(--hairline); }
  .past-report-row { display: flex; justify-content: space-between; padding: 12px 2px; font-size: 13px; border-bottom: 1px solid var(--hairline); text-decoration: none; color: var(--ink); }
  .past-report-row:hover { color: var(--korea); }
  .theme-toggle { position: fixed; top: 14px; right: 14px; font-size: 11px; color: var(--ink-muted); background: var(--surface); border: 1px solid var(--hairline); border-radius: 100px; padding: 6px 10px; cursor: pointer; font-family: inherit; z-index: 5; }
  .cookie-banner { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 20; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; display: none; gap: 14px; align-items: center; flex-wrap: wrap; max-width: 640px; margin: 0 auto; }
  .cookie-banner p { font-size: 12.5px; color: var(--ink-muted); margin: 0; flex: 1; min-width: 200px; }
  .cookie-actions { display: flex; gap: 8px; }
  .cookie-btn { font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 100px; border: none; cursor: pointer; font-family: inherit; }
  .cookie-accept { background: var(--ink); color: var(--bg); }
  .cookie-decline { background: none; color: var(--ink-muted); border: 1px solid var(--hairline); }
  @media (max-width: 480px) {
    .hero-art { height: 160px; } .hero-panel { margin-top: -40px; }
    .row { grid-template-columns: 1fr 72px; } .row-thumb { width: 72px; height: 72px; font-size: 20px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button">라이트/다크</button>

<div class="wrap">
  <a class="archive-back" href="../index.html" id="archiveBack">&larr; 최신 리포트로</a>
  <div id="landing">
    <p class="eyebrow">[Weekly Ice Cream Intelligence]</p>
    <div class="head-row">
      <h1 class="headline">이번 주 아이스크림 트렌드</h1>
      <div class="head-side">
        <p class="head-blurb">한국·미국·일본 3개 시장의 신제품, 바이럴 콘텐츠, 맛·패키징 통계를 매주 월요일 오전 8시에 정리합니다.</p>
        <a class="cta" href="../reports/2026-08-09-ice-cream-trends.pdf">최신 PDF 받기 ↓</a>
      </div>
    </div>
    <p class="list-label">이번 주 트렌드</p>
    <div class="hero-list" id="heroList"></div>
    <p class="list-label">지난 리포트</p>
    <div class="past-reports" id="pastReports"></div>
  </div>
  <div id="detail">
    <a class="back-link" href="#" id="backLink">&larr; 세 나라 보기로 돌아가기</a>
    <div class="detail-header">
      <div class="detail-badge" id="dBadge"></div>
      <h2 class="detail-title" id="dTitle"></h2>
      <p class="detail-summary" id="dSummary"></p>
    </div>
    <p class="list-label">맛 · 패키징 Top 5</p>
    <div class="panel" id="dChart"></div>
    <p class="list-label">이번 주 소식</p>
    <div class="list" id="dList"></div>
    <p class="list-label">참고자료</p>
    <div class="sources" id="dSources"></div>
  </div>
</div>

<div class="cookie-banner" id="cookieBanner">
  <p>이 사이트는 방문자 통계 수집을 위해 쿠키를 사용합니다.</p>
  <div class="cookie-actions">
    <button class="cookie-btn cookie-decline" id="cookieDecline" type="button">거부</button>
    <button class="cookie-btn cookie-accept" id="cookieAccept" type="button">수락</button>
  </div>
</div>
